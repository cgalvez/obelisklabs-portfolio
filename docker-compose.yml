services:
  portfolio:
    build:
      context: .
      # NEXT_PUBLIC_* se incrustan al compilar: tienen que llegar como build args
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://obelisklabs.dev}
        - NEXT_PUBLIC_UMAMI_ID=${NEXT_PUBLIC_UMAMI_ID:-}
        - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-}
    container_name: portfolio-cgc
    ports:
      - "3002:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production

  portfolio-dev:
    image: node:20-alpine
    container_name: portfolio-cgc-dev
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "npm install && npm run dev"
    profiles:
      - dev
